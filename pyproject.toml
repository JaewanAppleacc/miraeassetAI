[project]
name = "dart-corpus"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",   # Parser Pilot Phase — exchange(KIND xforms) malformed HTML 파싱용
    "tiktoken>=0.7",          # Fixed Token Chunker Phase — 모든 chunking 전략이 공유하는 token counting 규칙
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]
# QA 서버(src/dart_detective). anthropic은 없어도 되며,
# 자격증명이 없으면 결정론적 fallback 경로로 동작한다.
agent = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "anthropic>=0.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises the real corpus on disk, slower than unit tests",
]

[tool.setuptools.packages.find]
where = ["src"]
